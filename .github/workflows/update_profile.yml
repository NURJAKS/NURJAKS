name: Update Dynamic Profile README

on:
  schedule:
    # Runs daily at 00:00 UTC (05:00 AM KZ)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Profile Updater
        run: |
          python3 update_profile.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "NURJAKS"
          git config --global user.email "nurbekabildaev89@gmail.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs(profile): refresh daily telemetry and architectural thought"
            git push origin main
            echo "Successfully refreshed profile README."
          else
            echo "No changes in README."
          fi
