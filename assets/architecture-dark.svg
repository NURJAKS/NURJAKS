<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="ingressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.05" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; }
    .node-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 11px; fill: #94a3b8; }
    .node-tech { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 10px; fill: #cbd5e1; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 10px; fill: #94a3b8; }
    .card { rx: 8px; ry: 8px; stroke-width: 1.5px; }
  </style>

  <!-- Canvas Background -->
  <rect width="980" height="470" rx="12" fill="url(#bgGradDark)" stroke="#1e293b" stroke-width="1.5" />

  <!-- SECTION 1: INGRESS & GATEWAY -->
  <rect x="20" y="25" width="210" height="420" rx="10" fill="#131d31" fill-opacity="0.5" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,4" />
  <text x="35" y="50" class="title" fill="#38bdf8">1 · Ingress &amp; Gateway</text>

  <!-- Client Node -->
  <g transform="translate(35, 75)">
    <rect width="180" height="100" class="card" fill="url(#ingressGrad)" stroke="#0284c7" />
    <circle cx="24" cy="28" r="10" fill="#0369a1" />
    <path d="M 21 28 L 27 28 M 24 23 L 24 33" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" />
    <text x="42" y="32" class="node-header">Clients &amp; Ingress</text>
    <text x="16" y="58" class="node-sub">Web Apps, Mobile, Webhooks</text>
    <rect x="16" y="70" width="148" height="20" rx="4" fill="#0c4a6e" />
    <text x="24" y="84" class="node-tech">HTTP/2 · WSS · TLS 1.3</text>
  </g>

  <!-- Gateway Node -->
  <g transform="translate(35, 275)">
    <rect width="180" height="145" class="card" fill="url(#ingressGrad)" stroke="#0284c7" />
    <circle cx="24" cy="28" r="10" fill="#0369a1" />
    <path d="M 19 28 L 29 28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="42" y="32" class="node-header">Kong API Gateway</text>
    <text x="16" y="58" class="node-sub">• Centralized JWT Auth</text>
    <text x="16" y="76" class="node-sub">• IP &amp; Route Rate Limiting</text>
    <text x="16" y="94" class="node-sub">• Reverse Proxy &amp; SSL Offload</text>
    <rect x="16" y="112" width="148" height="20" rx="4" fill="#0c4a6e" />
    <text x="26" y="126" class="node-tech">Kong Gateway · Nginx</text>
  </g>

  <!-- SECTION 2: APPLICATION SERVICES -->
  <rect x="255" y="25" width="220" height="420" rx="10" fill="#0f291e" fill-opacity="0.4" stroke="#059669" stroke-width="1" stroke-dasharray="4,4" />
  <text x="270" y="50" class="title" fill="#34d399">2 · Core Application</text>

  <!-- App Services Node -->
  <g transform="translate(270, 140)">
    <rect width="190" height="220" class="card" fill="url(#appGrad)" stroke="#059669" />
    <circle cx="24" cy="28" r="10" fill="#047857" />
    <polygon points="21,24 28,28 21,32" fill="#d1fae5" />
    <text x="42" y="32" class="node-header">Backend Services</text>
    <text x="16" y="60" class="node-sub">• High-concurrency REST APIs</text>
    <text x="16" y="80" class="node-sub">• Event-driven domain logic</text>
    <text x="16" y="100" class="node-sub">• Atomic state transactions</text>
    <text x="16" y="120" class="node-sub">• Producer queue dispatch</text>

    <rect x="16" y="145" width="158" height="22" rx="4" fill="#064e3b" />
    <text x="22" y="160" class="node-tech">Go · NestJS · FastAPI</text>

    <rect x="16" y="175" width="158" height="22" rx="4" fill="#064e3b" />
    <text x="22" y="190" class="node-tech">Database-per-Service Isolation</text>
  </g>

  <!-- SECTION 3: DATA & QUEUES -->
  <rect x="500" y="25" width="225" height="420" rx="10" fill="#2d1c0b" fill-opacity="0.4" stroke="#d97706" stroke-width="1" stroke-dasharray="4,4" />
  <text x="515" y="50" class="title" fill="#fbbf24">3 · State &amp; Queues</text>

  <!-- PostgreSQL -->
  <g transform="translate(515, 75)">
    <rect width="195" height="100" class="card" fill="url(#dataGrad)" stroke="#d97706" />
    <text x="16" y="28" class="node-header">PostgreSQL Primary</text>
    <text x="16" y="48" class="node-sub">Partitioned states, FIFO/FEFO</text>
    <text x="16" y="66" class="node-sub">ACID transactions &amp; indexes</text>
    <rect x="16" y="74" width="163" height="18" rx="4" fill="#78350f" />
    <text x="22" y="87" class="node-tech">PostgreSQL 15 · Cloudflare D1</text>
  </g>

  <!-- Redis -->
  <g transform="translate(515, 190)">
    <rect width="195" height="100" class="card" fill="url(#dataGrad)" stroke="#d97706" />
    <text x="16" y="28" class="node-header">Redis In-Memory Cache</text>
    <text x="16" y="48" class="node-sub">Sub-millisecond read cache</text>
    <text x="16" y="66" class="node-sub">Pipelining &amp; session tokens</text>
    <rect x="16" y="74" width="163" height="18" rx="4" fill="#78350f" />
    <text x="22" y="87" class="node-tech">Redis 7 · Pipelining · TTL</text>
  </g>

  <!-- Message Brokers -->
  <g transform="translate(515, 305)">
    <rect width="195" height="115" class="card" fill="url(#dataGrad)" stroke="#d97706" />
    <text x="16" y="28" class="node-header">Message Brokers</text>
    <text x="16" y="48" class="node-sub">Dead letter queues &amp; retries</text>
    <text x="16" y="66" class="node-sub">Distributed task scheduling</text>
    <rect x="16" y="80" width="163" height="22" rx="4" fill="#78350f" />
    <text x="22" y="95" class="node-tech">BullMQ · RabbitMQ · Celery</text>
  </g>

  <!-- SECTION 4: ISOLATED WORKERS -->
  <rect x="750" y="25" width="210" height="420" rx="10" fill="#201335" fill-opacity="0.4" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,4" />
  <text x="765" y="50" class="title" fill="#a78bfa">4 · Compute Workers</text>

  <!-- Worker 1: Media -->
  <g transform="translate(765, 75)">
    <rect width="180" height="100" class="card" fill="url(#workerGrad)" stroke="#7c3aed" />
    <text x="14" y="26" class="node-header">Media Transcoding</text>
    <text x="14" y="46" class="node-sub">Async video compositing</text>
    <text x="14" y="62" class="node-sub">Isolated CPU/GPU pools</text>
    <rect x="14" y="72" width="152" height="18" rx="4" fill="#4c1d95" />
    <text x="20" y="85" class="node-tech">FFmpeg · BullMQ Worker</text>
  </g>

  <!-- Worker 2: Fleet & Events -->
  <g transform="translate(765, 190)">
    <rect width="180" height="100" class="card" fill="url(#workerGrad)" stroke="#7c3aed" />
    <text x="14" y="26" class="node-header">Logistics &amp; Routing</text>
    <text x="14" y="46" class="node-sub">VRP solvers &amp; road graphs</text>
    <text x="14" y="62" class="node-sub">Live telemetry streaming</text>
    <rect x="14" y="72" width="152" height="18" rx="4" fill="#4c1d95" />
    <text x="20" y="85" class="node-tech">VROOM · OSRM · WebSockets</text>
  </g>

  <!-- Worker 3: AI Agents -->
  <g transform="translate(765, 305)">
    <rect width="180" height="115" class="card" fill="url(#workerGrad)" stroke="#7c3aed" />
    <text x="14" y="26" class="node-header">Autonomous AI Agent</text>
    <text x="14" y="46" class="node-sub">Voice STT/TTS &amp; triage</text>
    <text x="14" y="62" class="node-sub">Isolated git worktrees</text>
    <rect x="14" y="78" width="152" height="24" rx="4" fill="#4c1d95" />
    <text x="20" y="94" class="node-tech">Whisper · Gemini · Worktree</text>
  </g>

  <!-- ARROWS & CONNECTORS -->
  <!-- Client to Gateway -->
  <path d="M 125 175 L 125 275" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
  <rect x="65" y="215" width="120" height="20" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
  <text x="75" y="229" class="edge-label" fill="#38bdf8">HTTPS / WSS</text>

  <!-- Gateway to App -->
  <path d="M 215 345 L 242 345 L 242 250 L 270 250" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- App to DB -->
  <path d="M 460 200 L 487 200 L 487 125 L 515 125" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
  <rect x="460" y="100" width="48" height="16" rx="3" fill="#0f172a" />
  <text x="463" y="112" class="edge-label" fill="#fbbf24">SQL</text>

  <!-- App to Redis -->
  <path d="M 460 240 L 515 240" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
  <rect x="465" y="230" width="45" height="16" rx="3" fill="#0f172a" />
  <text x="468" y="242" class="edge-label" fill="#fbbf24">Cache</text>

  <!-- App to Queue -->
  <path d="M 460 280 L 487 280 L 487 360 L 515 360" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
  <rect x="460" y="342" width="50" height="16" rx="3" fill="#0f172a" />
  <text x="463" y="354" class="edge-label" fill="#fbbf24">Publish</text>

  <!-- Queue to Worker 1 -->
  <path d="M 710 330 L 735 330 L 735 125 L 765 125" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)" />

  <!-- Queue to Worker 2 -->
  <path d="M 710 360 L 735 360 L 735 240 L 765 240" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)" />

  <!-- Queue to Worker 3 -->
  <path d="M 710 390 L 765 390" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)" />
</svg>
